name: Server CI

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'

env:
  GO_VERSION: '1.24.4'

defaults:
  run:
    working-directory: server/src

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
   lint-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          working-directory: server/src

      - name: Check formatting
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "Go files not formatted:"
            echo "$fmt"
            exit 1
          fi

      - name: Build
        run: go build cmd/route/main.go
